name: Publish GitHub Pages
run-name: Publish GitHub Pages ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build, for example v34
        required: true
        type: string

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  dispatch-pages-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages build from main
        uses: actions/github-script@v8
        with:
          script: |
            const releaseTag = context.payload.ref.replace('refs/tags/', '');
            if (!/^v[0-9]+$/.test(releaseTag)) {
              core.setFailed(`Expected a numeric release tag, got: ${releaseTag}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'main',
              inputs: { release_tag: releaseTag }
            });

  build-and-deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      # Use a separate environment because the default github-pages environment
      # currently restricts deployments to branches and rejects vN release tags.
      name: github-pages-release
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Prepare release directory
        shell: bash
        run: |
          rm -rf docs
          cp -R resources/public docs
          rm docs/index.html
          mv docs/release-index.html docs/index.html
          rm -rf docs/js/compiled

      - name: Build optimized application with source maps
        run: npx shadow-cljs release app

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+$ ]]; then
            echo "Release tag must be vN; got: $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ ! -f docs/manifest.json ]]; then
            echo "Release manifest is missing: docs/manifest.json" >&2
            exit 1
          fi
          export RELEASE_VERSION_NUMBER="$VERSION"
          node <<'NODE'
          const fs = require('fs');
          const path = 'docs/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = process.env.RELEASE_VERSION_NUMBER;
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Build service worker with source map
        run: npx nbb ./build-service-worker.cljs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
